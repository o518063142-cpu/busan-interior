name: AI Estimate Preview Check

on:
  push:
    branches:
      - chatgpt/ai-estimate-contract-engine-20261026
  pull_request:
    branches:
      - main
    paths:
      - "api/**"
      - "src/pages/AIEstimate*"
      - "src/components/ConversionTracker.tsx"
      - "src/pages/FunnelDashboardPage.tsx"
      - "src/routes/AppRoutes.tsx"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/ai-estimate-preview-check.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type check (legacy warning allowed)
        continue-on-error: true
        run: npm run lint

      - name: Application build
        run: npm run build

      - name: Install pinned Vercel CLI
        run: npm install --no-save --no-audit --no-fund vercel@64.7.0

      - name: Prepare Vercel project metadata
        run: |
          mkdir -p .vercel
          printf '%s' '{"orgId":"team_klypeyZIZQxotXI79RX2W5cz","projectId":"prj_BSz0h3DyINWAqAmvB0MXhyjY18UA"}' > .vercel/project.json

      - name: Vercel local build
        run: npx vercel build --yes
